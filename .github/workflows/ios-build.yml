# =============================================================================
# Grid.Pe Customer App — iOS Production IPA Build (Unsigned, for SideStore)
# =============================================================================
name: Build iOS Production IPA

on:
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
  VITE_MAPS_API_KEY: ${{ secrets.VITE_MAPS_API_KEY }}
  VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
  VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
  VITE_CORBADO_PROJECT_ID: ${{ secrets.VITE_CORBADO_PROJECT_ID }}
  VITE_CORBADO_API_SECRET: ${{ secrets.VITE_CORBADO_API_SECRET }}

jobs:
  build-ios-production:
    name: Build Unsigned Production IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Configure GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GRIDPE_NPM_TOKEN }}" >> .npmrc

      - name: Install npm dependencies
        env:
          NODE_OPTIONS: "--no-node-snapshot"
        run: npm ci --legacy-peer-deps

      - name: Build web app (production)
        run: npm run build

      - name: Validate web assets
        run: ls dist || exit 1

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Ensure Production Config
        run: |
          CONFIG="ios/App/App/capacitor.config.json"
          # Remove any "server" key to force loading local assets (prevents white screen)
          python3 -c "
          import json, sys
          with open('$CONFIG') as f:
              cfg = json.load(f)
          cfg.pop('server', None)
          with open('$CONFIG', 'w') as f:
              json.dump(cfg, f, indent=2)
          "
          echo "✅ Production config verified (No server.url override)"

      - name: Set app permissions & production mode
        run: |
          PLIST="ios/App/App/Info.plist"
          # App Names
          plutil -replace CFBundleDisplayName -string "Grid.Pe" "$PLIST"
          plutil -replace CFBundleName -string "GridPe" "$PLIST"
          # Permissions
          plutil -replace NSFaceIDUsageDescription -string "Grid.Pe needs FaceID to secure your account and allow quick login." "$PLIST"
          # Disable Debug Flag
          plutil -replace CAPACITOR_DEBUG -string "false" "$PLIST"

      - name: Resolve Swift Package Manager Dependencies
        working-directory: ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release

      - name: Build Xcode project (Release)
        working-directory: ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            | tee ../../xcodebuild.log | tail -50

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r -9 GridPeProduction.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridPeProduction-IPA
          path: GridPeProduction.ipa
          retention-days: 3
