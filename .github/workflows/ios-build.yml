name: Build iOS IPA (Sideload Ready)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/ios

      - name: Build Web Project
        run: npm run build

      - name: Initialize & Sync iOS
        run: |
          npx cap init GridPeRider com.gridpe.rider --web-dir dist
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          # We use xcodebuild on the project directly since the workspace might be finicky in CI
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r GridPeRider.ipa Payload
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridPeRider-IPA
          path: GridPeRider.ipa
