name: Build iOS IPA (Sideload Ready)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated to avoid that deprecation warning in your screenshot

      - name: Install Dependencies
        run: npm install --legacy-peer-deps # Helps bypass conflicts with that SIM manager library

      - name: Build Web Project
        run: npm run build

      - name: Capacitor Sync
        run: |
          npm install @capacitor/ios
          npx cap add ios || true
          npx cap sync ios

      - name: Build Xcode Project
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO
          
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r GridPeRider.ipa Payload
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridPeRider-IPA
          path: GridPeRider.ipa
