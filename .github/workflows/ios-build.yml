name: Grid.Pe Customer App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Verify Build Output
        run: |
          echo "=== dist/ contents ==="
          ls -la dist/
          echo "=== index.html check ==="
          cat dist/index.html

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Sync iOS Platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Verify iOS Web Assets
        run: |
          echo "=== iOS public folder ==="
          ls -la ios/App/App/public/ || echo "❌ PUBLIC FOLDER MISSING"
          echo "=== index.html in bundle ==="
          cat ios/App/App/public/index.html || echo "❌ INDEX.HTML MISSING"

      - name: Build Xcode Project
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r GridPeCustomer.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridPeCustomer-IPA
          path: GridPeCustomer.ipa
