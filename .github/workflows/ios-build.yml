name: Grid.Pe Customer App Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/ios --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Setup iOS Platform
        run: |
          rm -rf ios
          npx cap add ios
          # This command forces the App name change in the Xcode project
          npx cap sync ios

      - name: Set App Display Name
        run: |
          # Updates the Info.plist to show the proper name on the home screen
          PLIST="ios/App/App/Info.plist"
          plutil -replace CFBundleDisplayName -string "Grid.Pe Customer App" $PLIST
          plutil -replace CFBundleName -string "GridPeCustomer" $PLIST

      - name: Install CocoaPods
        run: |
          # We check both possible directories to avoid the "No Podfile" error
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install --repo-update
          else
            cd ios && pod install --repo-update
          fi

      - name: Build Xcode Project (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p Payload
          # Find the .app folder regardless of the specific build subfolder name
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r "GridPeCustomer.ipa" Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridPeCustomer-IPA
          path: GridPeCustomer.ipa
          retention-days: 7
