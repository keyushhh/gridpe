# =============================================================================
# Grid.Pe Customer App — iOS LIVE IPA Build (Unsigned, for SideStore)
# =============================================================================
name: Build iOS Live IPA

on:
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
  VITE_MAPS_API_KEY: ${{ secrets.VITE_MAPS_API_KEY }}
  VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
  VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
  VITE_CORBADO_PROJECT_ID: ${{ secrets.VITE_CORBADO_PROJECT_ID }}
  VITE_CORBADO_API_SECRET: ${{ secrets.VITE_CORBADO_API_SECRET }}

jobs:
  build-ios-live:
    name: Build Unsigned Live IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install npm dependencies
        env:
          NODE_OPTIONS: "--no-node-snapshot"
        run: npm ci --legacy-peer-deps

      - name: Build web app (production)
        run: npm run build

      - name: Validate web assets
        run: ls dist || exit 1

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Verify Live Reload IP
        run: |
          CONFIG="ios/App/App/capacitor.config.json"
          if grep -q "192.168.29.136" "$CONFIG"; then
            echo "✅ Found Live Reload IP: 192.168.29.136"
          else
            echo "❌ ERROR: Live Reload IP 192.168.29.136 not found in $CONFIG!"
            cat "$CONFIG"
            exit 1
          fi

      - name: Set app permissions & debug mode
        run: |
          PLIST="ios/App/App/Info.plist"
          # App Names
          plutil -replace CFBundleDisplayName -string "Grid.Pe Live" "$PLIST"
          plutil -replace CFBundleName -string "GridPeLive" "$PLIST"
          plutil -replace CFBundleIdentifier -string "com.gridpe.customer.dev" "$PLIST"
          # Permissions
          plutil -replace NSFaceIDUsageDescription -string "Grid.Pe needs FaceID to secure your account and allow quick login." "$PLIST"
          # Debug Flag
          plutil -replace CAPACITOR_DEBUG -string "true" "$PLIST"

      - name: Resolve Swift Package Manager Dependencies
        working-directory: ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug

      - name: Build Xcode project (Debug)
        working-directory: ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath ../../build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            | tee ../../xcodebuild.log | tail -50

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r -9 GridPeLive.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GridPeLive-IPA
          path: GridPeLive.ipa
