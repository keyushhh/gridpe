  <script>
    window.onerror = function(msg, url, line, col, error) {
      document.body.innerHTML += '<div style="color:red; background:white; padding:20px; position:absolute; top:0; left:0; right:0; z-index:9999; font-size:12px; word-wrap:break-word; max-height: 50vh; overflow-y: auto;"><b>JS Error:</b> ' + msg + '<br><b>URL:</b> ' + url + '<br><b>Line:</b> ' + line + '</div>';
    };
    window.addEventListener('unhandledrejection', function(event) {
      document.body.innerHTML += '<div style="color:white; background:red; padding:20px; position:absolute; bottom:0; left:0; right:0; z-index:9999; font-size:12px; word-wrap:break-word; max-height: 50vh; overflow-y: auto;"><b>Promise Error:</b> ' + (event.reason ? event.reason.toString() : 'Unknown Error') + '</div>';
    });
  </script>
